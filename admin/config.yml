# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: shangoff/site-sussac
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2bb060cd-b159-4ec1-8c7b-3cd7073b5741/pkce
  auth_token_endpoint: /sites/2bb060cd-b159-4ec1-8c7b-3cd7073b5741/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://regal-heliotrope-6a989b.netlify.app

# ==========================================================
#  Réglages du contenu (site de Sussac)
# ==========================================================

# Langue de l'interface
locale: fr

# Dossier où sont enregistrées les images téléversées depuis le CMS
media_folder: "images"
public_folder: "/images"

collections:
  # ---------------- ACTUALITÉS ----------------
  - name: "actualites"
    label: "Actualités"
    description: "Les nouvelles affichées sur la page d'accueil."
    files:
      - name: "liste"
        label: "Liste des actualités"
        file: "content/actualites.json"
        format: "json"
        fields:
          - label: "Actualités"
            name: "actualites"
            label_singular: "actualité"
            widget: "list"
            summary: "{{fields.titre}}"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - label: "Catégorie"
                name: "categorie"
                widget: "select"
                options: ["Vie locale", "Travaux", "Patrimoine", "Associations", "Information"]
                default: "Vie locale"
              - { label: "Photo (facultatif)", name: "image", widget: "image", required: false }
              - { label: "Texte", name: "texte", widget: "text" }

  # ---------------- AGENDA ----------------
  - name: "agenda"
    label: "Agenda"
    description: "Les événements affichés dans l'agenda du site."
    files:
      - name: "liste"
        label: "Liste des événements"
        file: "content/agenda.json"
        format: "json"
        fields:
          - label: "Événements"
            name: "evenements"
            label_singular: "événement"
            widget: "list"
            summary: "{{fields.titre}} — {{fields.date}}"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - { label: "Date", name: "date", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Heure (facultatif)", name: "heure", widget: "string", required: false }
              - { label: "Lieu (facultatif)", name: "lieu", widget: "string", required: false }
              - { label: "Détails (facultatif)", name: "details", widget: "text", required: false }

  # ---------------- RÉSERVATIONS GÎTES ----------------
  - name: "reservations"
    label: "Réservations gîtes"
    description: "Les périodes réservées, affichées sur le calendrier des gîtes."
    files:
      - name: "liste"
        label: "Liste des réservations"
        file: "content/reservations.json"
        format: "json"
        fields:
          - label: "Réservations"
            name: "reservations"
            label_singular: "réservation"
            widget: "list"
            summary: "{{fields.gite}} — du {{fields.arrivee}} au {{fields.depart}}"
            fields:
              - label: "Gîte"
                name: "gite"
                widget: "select"
                options: ["Gîte du Bourg", "Gîte de la Combade", "Gîte des Forêts"]
              - { label: "Date d'arrivée", name: "arrivee", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }
              - { label: "Date de départ", name: "depart", widget: "datetime", date_format: "DD/MM/YYYY", time_format: false, format: "YYYY-MM-DD" }

  # ---------------- TRAVAUX ----------------
  - name: "travaux"
    label: "Travaux"
    description: "Les chantiers affichés sur la page Travaux."
    files:
      - name: "liste"
        label: "Liste des travaux"
        file: "content/travaux.json"
        format: "json"
        fields:
          - label: "Chantiers"
            name: "travaux"
            label_singular: "chantier"
            widget: "list"
            summary: "{{fields.titre}} — {{fields.statut}}"
            fields:
              - { label: "Titre", name: "titre", widget: "string" }
              - label: "Statut"
                name: "statut"
                widget: "select"
                options: ["À venir", "En cours", "Terminé"]
                default: "En cours"
              - { label: "Sous-titre / catégorie (facultatif)", name: "meta", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Avancement en % (pour « En cours »)", name: "avancement", widget: "number", required: false, value_type: "int", min: 0, max: 100 }
              - { label: "Intervenant (facultatif)", name: "intervenant", widget: "string", required: false }
              - { label: "Coût / financement (facultatif)", name: "financement", widget: "string", required: false }

  # ---------------- ARTISANS & COMMERCES ----------------
  - name: "artisans"
    label: "Artisans & commerces"
    description: "L'annuaire des artisans, commerçants et producteurs locaux."
    files:
      - name: "liste"
        label: "Liste des artisans"
        file: "content/artisans.json"
        format: "json"
        fields:
          - label: "Artisans & commerces"
            name: "artisans"
            label_singular: "artisan"
            widget: "list"
            summary: "{{fields.nom}} — {{fields.activite}}"
            fields:
              - { label: "Nom", name: "nom", widget: "string" }
              - { label: "Activité / métier", name: "activite", widget: "string" }
              - { label: "Description (facultatif)", name: "description", widget: "text", required: false }
              - { label: "Téléphone (facultatif)", name: "telephone", widget: "string", required: false }
              - { label: "E-mail (facultatif)", name: "email", widget: "string", required: false }
              - { label: "Adresse (facultatif)", name: "adresse", widget: "string", required: false }
              - { label: "Site internet (facultatif)", name: "site", widget: "string", required: false }
