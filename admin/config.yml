# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: shangoff/site-sussac
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2bb060cd-b159-4ec1-8c7b-3cd7073b5741/pkce
  auth_token_endpoint: /sites/2bb060cd-b159-4ec1-8c7b-3cd7073b5741/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} â€œ{{slug}}â€ - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} â€œ{{slug}}â€ - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} â€œ{{slug}}â€ - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload â€œ{{path}}â€ - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete â€œ{{path}}â€ - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://aesthetic-marzipan-ab1057.netlify.app

